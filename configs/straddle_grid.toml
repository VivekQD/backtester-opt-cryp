# Sweep config: base + a [grid] of strategy params (cartesian product).

[data]
path = "data/options_data/BTC_USDC.parquet"

[venue]
margin = "linear"
contract_size = 1.0

[run]
cash = 100000.0

[fill]
half_spread_bps = 5.0
slippage_bps = 1.0

[strategy]
dte_min = 3
dte_max = 10
qty = 1

[grid]
dte_min = [2, 3, 5]
dte_max = [7, 14]
