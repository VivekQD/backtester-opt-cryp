[project]
name = "lightweight-options-backtester"
version = "0.1.0"
description = "Sparse event-driven backtesting for Laevitas Deribit option archives"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["jupyterlab", "pandas", "plotly"]

[project.scripts]
lwbt = "lightweight_backtester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightweight_backtester"]
